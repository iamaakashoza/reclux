<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reclux webcam</title>
    <!-- Shown inside web pages (as a frame) while recording. A Reclux page, so websites never get the camera. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
        transform: scaleX(-1); /* a mirror, like every video call */
        background: #0e1116;
      }
    </style>
  </head>
  <body>
    <video autoplay muted playsinline></video>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
